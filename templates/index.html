<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAINT — Red Team Recon Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="topbar">
  <div>
    <p class="wordmark">SA<span>I</span>NT</p>
    <div class="tagline">AI copilot for red team recon</div>
  </div>
  <div class="meta" id="metaInfo">awaiting scan</div>
</div>

<div class="status-line" id="status"></div>

<div class="layout">

  <div class="left-col">
    <div class="panel">
      <h2>Target</h2>
      <input type="text" id="domain" placeholder="target domain, e.g. scanme.nmap.org">
      <button class="scan-btn" id="scanBtn" onclick="runScan()">Run recon</button>
      <label class="demo-toggle">
        <input type="checkbox" id="demoMode"> demo mode — cached data, no live scan
      </label>
    </div>

    <div class="panel">
      <h2>subfinder <span class="count" id="subCount"></span></h2>
      <div class="sub-list" id="subList">
        <div class="empty-hint">no scan run yet</div>
      </div>
    </div>
  </div>

  <div class="right-col">
    <div class="right-top">
      <div class="panel">
        <h2>httpx <span class="count" id="httpxCount"></span></h2>
        <div id="httpxList"><div class="empty-hint">no scan run yet</div></div>
      </div>
      <div class="panel">
        <h2>naabu <span class="count" id="naabuCount"></span></h2>
        <div id="naabuList"><div class="empty-hint">no scan run yet</div></div>
      </div>
    </div>

    <div class="ai-box">
      <h2>AI assessment</h2>
      <div id="aiContent">
        <div class="empty-hint">run recon to get a prioritized attack surface</div>
      </div>
    </div>
  </div>

</div>

<script>
async function runScan() {
  const domain = document.getElementById('domain').value.trim();
  const demoMode = document.getElementById('demoMode').checked;
  const btn = document.getElementById('scanBtn');
  const status = document.getElementById('status');

  if (!demoMode && !domain) {
    status.className = 'status-line error';
    status.textContent = 'Enter a domain, or check demo mode.';
    return;
  }

  btn.disabled = true;
  status.className = 'status-line';
  status.textContent = 'Running recon' + (demoMode ? ' (demo data)' : '') + '... this can take up to a minute on a live scan.';
  document.getElementById('metaInfo').textContent = 'scanning...';

  try {
    const res = await fetch('/scan', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({domain, demo_mode: demoMode})
    });
    const data = await res.json();

    if (data.error) {
      status.className = 'status-line error';
      status.textContent = data.error;
    } else {
      status.textContent = '';
    }

    render(data);
  } catch (e) {
    status.className = 'status-line error';
    status.textContent = 'Request failed: ' + e;
  } finally {
    btn.disabled = false;
  }
}

function esc(s) { return (s || '').toString().replace(/</g, '&lt;'); }

function render(data) {
  const scan = data.scan || {};
  const alive = scan.alive_hosts || [];
  const aliveHostNames = new Set(alive.map(h => h.host));

  document.getElementById('metaInfo').innerHTML =
    '<b>' + esc(scan.domain || '') + '</b> · ' + (scan.elapsed_seconds || 0) + 's';

  const subList = document.getElementById('subList');
  const subs = scan.subdomains || [];
  document.getElementById('subCount').textContent = subs.length ? '(' + subs.length + ')' : '';
  subList.innerHTML = subs.length
    ? subs.map(s => '<div class="sub-row' + (aliveHostNames.has(s) ? ' alive' : '') + '">' + esc(s) + '</div>').join('')
    : '<div class="empty-hint">no subdomains found</div>';

  const httpxList = document.getElementById('httpxList');
  document.getElementById('httpxCount').textContent = alive.length ? '(' + alive.length + ')' : '';
  httpxList.innerHTML = alive.length
    ? alive.map(h => {
        const codeClass = (h.status_code >= 200 && h.status_code < 300) ? 'status-2xx' : 'status-4xx';
        return '<div class="kv-row"><span class="kv-host">' + esc(h.host) +
               '<span class="status-code ' + codeClass + '">' + esc(h.status_code) + '</span></span>' +
               '<span class="kv-detail">' + esc((h.tech || []).join(', ')) + '</span></div>';
      }).join('')
    : '<div class="empty-hint">no alive hosts</div>';

  const naabuList = document.getElementById('naabuList');
  const portEntries = Object.entries(scan.open_ports || {});
  document.getElementById('naabuCount').textContent = portEntries.length ? '(' + portEntries.length + ')' : '';
  naabuList.innerHTML = portEntries.length
    ? portEntries.map(([host, ports]) =>
        '<div class="kv-row" style="flex-direction:column;align-items:flex-start;gap:4px">' +
        '<span class="kv-host">' + esc(host) + '</span>' +
        '<span>' + ports.map(p => '<span class="port-tag">' + p + '</span>').join('') + '</span></div>'
      ).join('')
    : '<div class="empty-hint">no open ports found</div>';

  const aiContent = document.getElementById('aiContent');
  const analysis = data.analysis;
  let html = '';

  if (analysis && analysis.parse_error) {
    html += '<div class="raw-fallback"><p style="color:var(--rust)">AI response could not be parsed as JSON. Raw response (also printed in your terminal):</p>' +
            '<pre>' + esc(analysis.raw_response) + '</pre></div>';
  } else if (analysis && analysis.priority_targets && analysis.priority_targets.length) {
    html += analysis.priority_targets.map(t =>
      '<div class="target-card ' + t.risk_level + '">' +
      '<div class="host-line"><span class="host">' + esc(t.host) + '</span>' +
      '<span class="risk-badge ' + t.risk_level + '">' + esc(t.risk_level) + '</span></div>' +
      '<div class="reason">' + esc(t.reason) + '</div></div>'
    ).join('');

    if (analysis.next_steps && analysis.next_steps.length) {
      html += '<div class="ai-subsection"><h3>next steps</h3><ul>' +
              analysis.next_steps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>';
    }
    if (analysis.noise && analysis.noise.length) {
      html += '<div class="ai-subsection"><h3>deprioritized</h3><ul>' +
              analysis.noise.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>';
    }
  } else if (data.error) {
    html = '<div class="empty-hint">AI assessment unavailable — see message above.</div>';
  } else {
    html = '<div class="empty-hint">no priority targets returned</div>';
  }

  aiContent.innerHTML = html;
}
</script>
</body>
</html>
